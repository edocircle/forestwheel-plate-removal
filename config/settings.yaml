# Forest Wheel Photo Pipeline Configuration

paths:
  input_dir: "data/test_photos"
  output_dir: "data/output"
  review_dir: "data/review"
  debug_dir: "data/debug"
  state_file: "data/processed_state.json"
  template_config: "config/template.yaml"
  plate_overlay_asset: "assets/plate_overlay.png"
  logo_asset: "assets/logo.png"

detection:
  weights_path: "models/plate_yolov8n.pt"
  weights_url: "https://huggingface.co/Koushim/yolov8-license-plate-detection/resolve/main/best.pt"
  confidence_threshold: 0.40
  max_inference_size: 1280
  device: "cpu"
  supported_extensions:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".heic"

overlay:
  padding_ratio: 0.08
  min_padding_px: 4
  feather_px: 5
  canny_low: 50
  canny_high: 150
  approx_poly_epsilon: 0.04
  min_quad_area_ratio: 0.25
  max_quad_area_ratio: 0.98

output:
  active_profile: "website"
  jpeg_quality: 92

sync:
  rclone_binary: "rclone"
  remote_name: "gdrive"
  remote_inbox: "Forest Wheel Inventory/inbox"
  remote_processed: "Forest Wheel Inventory/processed"
  remote_review: "Forest Wheel Inventory/review"
  local_inbox_dir: "/srv/fw/inbox"
  local_output_dir: "/srv/fw/output"
  local_review_dir: "/srv/fw/review"
  car_state_file: "/srv/fw/state/synced_cars.json"
  ready_marker_file: "ready.txt"
  quiescence_seconds: 90
  rclone_timeout_seconds: 600
  skip_video_extensions:
    - ".mp4"
    - ".mov"
    - ".avi"
    - ".mkv"
    - ".m4v"
    - ".webm"
    - ".3gp"
  telegram:
    enabled: true
    bot_token_env: "FW_TELEGRAM_BOT_TOKEN"
    chat_id_env: "FW_TELEGRAM_CHAT_ID"
    timeout_seconds: 10


