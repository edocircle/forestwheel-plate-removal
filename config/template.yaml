# Forest Wheel Template Layout Configuration
# Supports two output profiles: "website" (4:3 listing) and "social_4_5" (4:5 portrait)

profiles:
  website:
    canvas_size: [1600, 1200]
    background_color: "#112219"
    border:
      enabled: true
      width: 14
      color: "#D4AF37"
      inset: 18
    photo:
      box: [36, 36, 1564, 1070]
      fit_mode: "cover"
      background_color: "#162A20"
    logo:
      enabled: true
      path: "assets/logo.png"
      position: [48, 1088]
      max_size: [280, 74]
    text_fields:
      - text: "FOREST WHEEL AUTOMOBILE"
        position: [1548, 1112]
        anchor: "ra"
        font_path: ""
        font_size: 26
        color: "#FFFFFF"
      - text: "SINGAPORE QUALITY PRE-OWNED VEHICLES"
        position: [1548, 1146]
        anchor: "ra"
        font_path: ""
        font_size: 16
        color: "#D4AF37"

  social_4_5:
    canvas_size: [1080, 1350]
    background_color: "#112219"
    border:
      enabled: true
      width: 12
      color: "#D4AF37"
      inset: 16
    photo:
      box: [32, 130, 1048, 1180]
      fit_mode: "cover"
      background_color: "#162A20"
    logo:
      enabled: true
      path: "assets/logo.png"
      position: [380, 32]
      max_size: [320, 80]
    text_fields:
      - text: "FOREST WHEEL AUTOMOBILE"
        position: [540, 1230]
        anchor: "mm"
        font_path: ""
        font_size: 28
        color: "#FFFFFF"
      - text: "QUALITY PRE-OWNED • SINGAPORE"
        position: [540, 1272]
        anchor: "mm"
        font_path: ""
        font_size: 18
        color: "#D4AF37"
